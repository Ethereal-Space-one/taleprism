[project]
name = "storygal"
version = "0.2.0"
description = "Taleprism: local-first illustrated fiction workbench"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=11",
    "websockets>=15,<17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storygal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["content_pack: optional full historical sample integration"]

[tool.ruff]
line-length = 100
target-version = "py311"
