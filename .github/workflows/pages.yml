name: Publish reading example
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - run: uv sync --project backend --frozen
      - run: npm --prefix tools/webgal-verify ci --omit=dev --no-audit --no-fund
      - name: Stage exact public Release reader and exercise the featured edition before deployment
        run: |
          python3 tools/prepare_pages.py --output .release/site --retain-archive .release/chibi-reader.zip
          uv run --project backend --frozen python tools/check_edition_semantics.py --reader-zip .release/chibi-reader.zip --book chibi --site-dir .release/site --report .release/pages-acceptance.json
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: .release/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - run: uv sync --project backend --frozen
      - run: npm --prefix tools/webgal-verify ci --omit=dev --no-audit --no-fund
      - name: Compare the live reading room to the Release and try the actual public book
        run: |
          python3 tools/prepare_pages.py --output .release/reference --retain-archive .release/chibi-reader.zip
          for attempt in 1 2 3; do
            if uv run --project backend --frozen python tools/check_edition_semantics.py --reader-zip .release/chibi-reader.zip --book chibi --live-url https://ethereal-space-one.github.io/taleprism/ --report .release/pages-live-acceptance.json; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 45; fi
          done
          echo 'Live edition mismatch or unreadable experience. No further deployment or automatic rollback is performed.' >&2
          exit 1
