    <path d="M731 216c27-8 53-11 86-13m-156 34c30-10 55-17 81-22" stroke-width="1.1" opacity=".39"/>
  </g>
  <path d="M777 201h19l5-4 6 8 7-15 8 22 7-36 8 48 7-42 7 25 7-12 7 6h23"
