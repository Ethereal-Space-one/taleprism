  <g fill="none" stroke="#4f6668" stroke-linecap="round">
    <path d="M335 160c70-10 143 2 215 39m-214-26c71-8 145 4 209 37m-208-24c65-7 137 5 204 36m-202-23c63-4 128 5 185 30" stroke-width="1.8" opacity=".69"/>
