<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 328" role="img" aria-labelledby="t d">
  <title id="t">Taleprism</title>
  <desc id="d">An open book, its printed lines becoming a river landscape and a quiet sound wave.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fbf8f0"/><stop offset="1" stop-color="#eeeee5"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#30434b"/><stop offset="1" stop-color="#728587"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#81918d"/><stop offset="1" stop-color="#b5beb4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leaf">
      <stop stop-color="#e8e6d8"/><stop offset=".23" stop-color="#fcfaf1"/>
      <stop offset="1" stop-color="#f8f5ea"/>
    </linearGradient>
    <pattern id="fiber" width="37" height="31" patternUnits="userSpaceOnUse">
      <path d="M2 8h1m20 15h1m4-20h1M11 29h1m6-17h1M35 13h1" stroke="#817d62" stroke-opacity=".12" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="1200" height="328" rx="19" fill="url(#paper)"/>
  <rect width="1200" height="328" rx="19" fill="url(#fiber)"/>
  <rect x=".5" y=".5" width="1199" height="327" rx="18.5" fill="none" stroke="#d5d5c8"/>
  <path d="M82 259C193 247 311 252 399 263m399 3c91-13 206-16 320-4" fill="none" stroke="#9ba6a0" stroke-opacity=".43"/>
  <path d="M128 275c65-7 132-8 201-2m536 3c69-7 131-9 210-6" fill="none" stroke="#9ba6a0" stroke-opacity=".29"/>
  <circle cx="866" cy="86" r="33" fill="#b75d50" opacity=".12"/>
  <circle cx="866" cy="86" r="25" fill="#b75d50" opacity=".72"/>
  <path d="M866 61a25 25 0 0 1 15 45m-35-12a25 25 0 0 1-3-14" fill="none" stroke="#874a42" stroke-opacity=".55"/>
  <!-- Remote banks dissolve before the book's horizon. -->
  <path d="M475 192c30-12 58-39 86-53l35-29 24 14 25 24 26-14 34 22 29-22 44-27 24 11 38 32 36-12 43 31 31-5 88 31H475z" fill="url(#wash)" opacity=".64"/>
  <path d="M549 194c30-16 60-27 80-48l23-11 27 16 14 8 19-13 26-33 37-28 21 16 25 35 28 7 29 28 24-8 52 35z" fill="#899a94" opacity=".34"/>
  <path d="M542 190c32-6 55-29 86-39l24-11 31 17m46-33 45-35 21 15 25 35 28 9 29 23"
        fill="none" stroke="#556b6c" stroke-width="1.25" stroke-opacity=".54" stroke-linecap="round"/>
  <!-- Hills close to the fold. -->
  <path d="M614 205c29-12 49-37 64-51l28-32 14 9 28 35 13 4 24 24 34-6 18 4 33 13z" fill="url(#ink)" opacity=".91"/>
  <path d="M624 199c27-16 42-24 63-53l19-23 12 10 26 33 17 5 26 22m-86-63-9 28-17 12m44-34 4 22 13 13m-73 14 18-7 18-16"
        fill="none" stroke="#31474c" stroke-width="1.3" stroke-opacity=".77" stroke-linecap="round"/>
  <path d="M748 190c30-8 44-8 65-3l33 6 27-8 33 3 35 13" fill="none" stroke="#697f7d" stroke-width="1.3" opacity=".7"/>
  <path d="M902 204c27-4 52-5 77-2m-68 9 42-3m-198 0c16 0 34-1 49-3" fill="none" stroke="#6f8b8b" stroke-opacity=".56" stroke-linecap="round"/>
  <!-- Sewn folio and two pages. -->
  <path d="M288 231c94-14 197-10 301 34 94-37 177-47 275-29l15 20c-107-12-189 4-290 38-100-36-194-46-313-31z"
        fill="#35484d" opacity=".12"/>
  <path d="M299 145c93-27 188-5 290 46 99-52 196-64 290-38l-21 88c-93-16-176 1-269 41-94-39-186-58-285-40z"
        fill="#b6b8a9" stroke="#495c5d" stroke-width="2"/>
  <path d="M300 137c94-22 183-8 289 46l0 88c-90-43-187-61-286-41z"
        fill="url(#leaf)" stroke="#596a69" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M589 183c101-52 194-65 290-41l-18 87c-94-15-178 4-272 42z"
